config firewall address
    edit "LAN_Uffici"
        set subnet 10.10.0.0 255.255.0.0
    next
end
config firewall policy
    edit 1
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "LAN_Uffici"
        set dstaddr "all"
        set action accept
        set service "HTTPS"
    next
    edit 2
        set srcintf "wan1"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set service "ALL"
    next
end
