config firewall service custom
    edit "CUSTOM_DB"
        set tcp-portrange 3306
    next
end
config firewall service group
    edit "GRUPPO_INUTILE"
        set member "CUSTOM_DB"
    next
end
config firewall policy
    edit 10
        set srcintf "wan1"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set service "ALL"
    next
end
