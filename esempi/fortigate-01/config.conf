config firewall address
    edit "Rete_Uffici"
        set subnet 10.0.0.0 255.0.0.0
    next
    edit "Server_Web"
        set subnet 10.1.2.10 255.255.255.255
    next
    edit "Vecchio_Server"
        set subnet 10.9.9.9 255.255.255.255
    next
end
config firewall addrgrp
    edit "Tutti_Interni"
        set member "Rete_Uffici" "Server_Web"
    next
end
config firewall service custom
    edit "WEB_HTTPS"
        set tcp-portrange 443
    next
end
config firewall policy
    edit 1
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "Tutti_Interni"
        set dstaddr "all"
        set action accept
        set service "WEB_HTTPS"
    next
    edit 2
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "Server_Web"
        set dstaddr "all"
        set action accept
        set service "WEB_HTTPS"
    next
end
