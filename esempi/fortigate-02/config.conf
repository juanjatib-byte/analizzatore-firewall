config firewall address
    edit "Host_Admin"
        set subnet 192.168.1.50 255.255.255.255
    next
end
config firewall policy
    edit 1
        set srcintf "wan1"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "Host_Admin"
        set action deny
        set service "SSH"
    next
    edit 2
        set srcintf "wan1"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "Host_Admin"
        set action accept
        set service "SSH"
    next
    edit 3
        set srcintf "wan1"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "Host_Admin"
        set action accept
        set service "RDP"
    next
end
